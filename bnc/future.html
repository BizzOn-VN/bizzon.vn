<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Futures PnL Calculator</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; background: #f5f7fa; }
    h2 { color: #2c3e50; }
    .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 3px 6px rgba(0,0,0,0.1); max-width: 600px; }
    label { display: block; margin-top: 12px; font-weight: bold; }
    input, select { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; }
    button { margin-top: 20px; padding: 10px; background: #3498db; color: white; border: none; border-radius: 6px; cursor: pointer; }
    button:hover { background: #2980b9; }
    .result { margin-top: 20px; padding: 15px; border-radius: 8px; background: #ecf0f1; }
    .positive { color: green; font-weight: bold; }
    .negative { color: red; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Futures PnL Calculator</h2>
    
    <label>Side</label>
    <select id="side">
      <option value="long">Long</option>
      <option value="short">Short</option>
    </select>

    <label>Notional (USDT)</label>
    <input type="number" id="notional" value="6000">

    <label>Entry Price</label>
    <input type="number" id="entry" value="4500">

    <label>Exit Price</label>
    <input type="number" id="exit" value="4520">

    <label>Leverage</label>
    <input type="number" id="leverage" value="10">

    <label>Maker Fee Rate (e.g. 0.0002 = 0.02%)</label>
    <input type="number" id="makerFee" step="0.0001" value="0.0002">

    <label>Taker Fee Rate (e.g. 0.0004 = 0.04%)</label>
    <input type="number" id="takerFee" step="0.0001" value="0.0004">

    <label>Use BNB discount (10%)</label>
    <select id="bnbDiscount">
      <option value="yes">Yes</option>
      <option value="no" selected>No</option>
    </select>

    <label>Funding Rate per 8h (e.g. 0.0001 = 0.01%)</label>
    <input type="number" id="fundingRate" step="0.0001" value="0.0001">

    <label>Holding Time (hours)</label>
    <input type="number" id="holdingHours" value="24">

    <button onclick="calc()">Calculate</button>

    <div class="result" id="output"></div>
  </div>

  <script>
    function calc() {
      const side = document.getElementById("side").value;
      const notional = parseFloat(document.getElementById("notional").value);
      const entry = parseFloat(document.getElementById("entry").value);
      const exit = parseFloat(document.getElementById("exit").value);
      const leverage = parseFloat(document.getElementById("leverage").value);
      const makerFee = parseFloat(document.getElementById("makerFee").value);
      const takerFee = parseFloat(document.getElementById("takerFee").value);
      const fundingRate = parseFloat(document.getElementById("fundingRate").value);
      const holdingHours = parseFloat(document.getElementById("holdingHours").value);
      const bnbDiscount = document.getElementById("bnbDiscount").value;

      if (!notional || !entry || !exit) {
        document.getElementById("output").innerHTML = "<span class='negative'>Please fill all required fields.</span>";
        return;
      }

      const qty = notional / entry; // contract size
      let grossPnl = (exit - entry) * qty;
      if (side === "short") grossPnl = (entry - exit) * qty;

      // Fees
      let openFee = notional * takerFee;
      let closeFee = (qty * exit) * takerFee;
      if (bnbDiscount === "yes") {
        openFee *= 0.9; closeFee *= 0.9;
      }
      const tradeFees = openFee + closeFee;

      // Funding
      const fundingPeriods = Math.ceil(holdingHours / 8);
      const funding = notional * fundingRate * fundingPeriods;

      // Net
      const netPnl = grossPnl - tradeFees - funding;
      const margin = notional / leverage;

      document.getElementById("output").innerHTML = `
        <b>Qty:</b> ${qty.toFixed(4)} ETH<br>
        <b>Gross PnL:</b> ${grossPnl.toFixed(2)} USDT<br>
        <b>Open Fee:</b> ${openFee.toFixed(4)} USDT<br>
        <b>Close Fee:</b> ${closeFee.toFixed(4)} USDT<br>
        <b>Total Trade Fees:</b> ${tradeFees.toFixed(4)} USDT<br>
        <b>Funding Cost:</b> ${funding.toFixed(4)} USDT<br>
        <b>Net PnL:</b> <span class='${netPnl >= 0 ? "positive" : "negative"}'>${netPnl.toFixed(2)} USDT</span><br>
        <b>Required Margin (@${leverage}x):</b> ${margin.toFixed(2)} USDT
      `;
    }
  </script>
</body>
</html>
