<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hung GPT</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Hung GPT</h1>
      <div class="user-profile">
        <span class="temp-tag">Temporary</span>
        <img src="https://via.placeholder.com/32" class="avatar" alt="User"/>
      </div>
    </header>

    <main>
      <div class="chat-area" id="chatArea">
        <div class="message bot">Hung GPT: What can I help with?</div>
      </div>
    </main>

    <footer>
      <div class="input-box">
        <input type="text" id="userInput" placeholder="Ask anything..." />
        <button title="Voice Input">🎤</button>
        <button title="Submit" onclick="handleSend()">⬆️</button>
      </div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
