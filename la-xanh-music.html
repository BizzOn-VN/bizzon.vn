<!DOCTYPE html>
<html>
<head>
  <title>Bài hát của lớp Lá Xanh</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-size: 16px;
      line-height: 1.6;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      position: relative;
    }
    audio {
      width: 100%;
    }
    img.logo {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      max-width: 200px; /* Giới hạn kích thước tối đa của hình ảnh là 200px */
    }
    br {
      display: none; /* Ẩn các thẻ <br> trên màn hình di động */
    }
  </style>
</head>
<body>

  1 - La Xanh Gia Dinh Dau Yeu | Tran Man Nghi ft Bich Tram <br>
  <audio id="audio1" controls>
    <source src="/music2/laxanh-master.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>
  <br><br>

  2 - La Xanh Truong Mam Non Em Yeu | Moon Nghi <br>
  <audio id="audio2" controls>
    <source src="/music2/laxanh-bemoon.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>
  <br><br>

  3 - La Xanh Truong Man Non Em Yeu | Tran Man Nghi <br>
  <audio id="audio3" controls>
    <source src="/music2/laxanh-tranmannghi.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>
  <br><br>

  4 - Vui Den Truong Mam Non La Xanh | Tran Man Nghi<br>
  <audio id="audio4" controls>
    <source src="/music2/la-xanh-tranmannghiv2.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <!-- Hình ảnh logo -->
  <img src="img/laxanhlogo.jpg" class="logo" alt="Logo">

  <script>
    const audios = document.querySelectorAll('audio');

    audios.forEach(audio => {
      audio.addEventListener('play', () => {
        audios.forEach(a => {
          if (a !== audio) {
            a.pause();
          }
        });
      });
    });
  </script>

</body>
</html>
